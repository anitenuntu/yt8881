  <title>#呙呙 - 早濑优香 #蔚蓝档案 #巨乳 #足控</title>
  <style>
    /* ---------- 顶部 Banner ---------- */
    .top-banner { margin: 0; text-align: center; animation: fadeIn .6s ease both; }
    .top-banner a {
      display: block; line-height: 0;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .25s ease;
    }
    .top-banner a:hover { box-shadow: var(--shadow-md); }
    .top-banner img { display: block; width: 100%; height: auto; max-width: 100%; background: #eef0f3; }
    .top-banner .fallback {
      display: none; padding: 40px 16px; background: var(--bg-card);
      border: 1px dashed var(--line); border-radius: var(--radius-md);
      color: var(--text-mute); font-size: 14px;
    }
    .top-banner.fail img { display: none; }
    .top-banner.fail .fallback { display: block; }

    /* ---------- 基础 ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f5f6f8; --bg-card: #ffffff; --text: #1a1d23;
      --text-soft: #6b7280; --text-mute: #9aa1ac; --line: #e8eaee;
      --accent: #2563eb; --accent-soft: #eff4ff;
      --warn: #b45309; --warn-soft: #fef3c7;
      --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, .06), 0 2px 4px rgba(15, 23, 42, .04);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, .18);
      --maxw: 1180px;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }
    .container { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

    /* ---------- 头部 ---------- */
    .hero { padding: 22px 0 28px; text-align: center; animation: fadeUp .6s ease both; }
    .hero h1 {
      margin: 0; font-size: clamp(28px, 4.4vw, 40px); font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #1a1d23 0%, #2563eb 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero .subtitle { margin: 10px 0 0; color: var(--text-soft); font-size: 14px; }
    .hero .notice {
      margin: 16px auto 0; max-width: 760px; padding: 0 12px;
      color: var(--text-mute); font-size: 13px; line-height: 1.75; text-align: center;
    }
    .hero .notice .greeting { color: var(--text-soft); font-weight: 600; letter-spacing: .02em; }
    .hero .tagline {
      margin: 14px auto 0; display: inline-block; padding: 6px 18px;
      font-size: 13px; letter-spacing: .08em; color: var(--accent);
      background: var(--accent-soft); border-radius: 999px; line-height: 1.5;
      text-decoration: none; cursor: pointer; position: relative;
      transition: background .2s ease, color .2s ease, transform .15s ease;
      animation: taglineBreath 3.2s ease-in-out infinite;
    }
    /* 标语按钮扩散波纹（与悬浮按钮同款呼吸节奏） */
    .hero .tagline::before,
    .hero .tagline::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 999px;
      border: 2px solid var(--ripple, rgba(37, 99, 235, .32));
      pointer-events: none;
      animation: rippleWave 3.2s ease-out infinite;
    }
    .hero .tagline::after { animation-delay: 1.6s; }
    @keyframes taglineBreath {
      0%, 100% { box-shadow: 0 0 0 rgba(37, 99, 235, 0); }
      50%      { box-shadow: 0 4px 16px rgba(37, 99, 235, .30); }
    }
    .hero .tagline:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }

    /* ---------- 画廊 ---------- */
    .gallery {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px; padding-bottom: 110px; animation: fadeUp .6s .1s ease both;
    }
    .card {
      position: relative; background: var(--bg-card); border: 1px solid var(--line);
      border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #d8dde5; cursor: zoom-in; }
    .card .thumb {
      display: block; width: 100%; height: auto; object-fit: contain;
      background: #eef0f3; transition: transform .4s ease;
    }
    .card:hover .thumb { transform: scale(1.03); }
    .empty { text-align: center; color: var(--text-mute); padding: 40px 0; font-size: 14px; }

    /* ---------- 灯箱 ---------- */
    .lightbox {
      position: fixed; inset: 0; background: rgba(10, 12, 18, .78);
      display: none; align-items: center; justify-content: center;
      padding: 24px; z-index: 100; animation: fadeIn .2s ease both;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 96vw; max-height: 92vh; border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg); background: #000;
    }
    .lightbox .close {
      position: absolute; top: 18px; right: 18px; width: 38px; height: 38px;
      border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff;
      border: none; font-size: 20px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background .2s ease;
    }
    .lightbox .close:hover { background: rgba(255, 255, 255, .22); }

    /* ---------- 底部悬浮按钮 ---------- */
    .float-btn {
      position: fixed; left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%); z-index: 50;
      display: inline-flex; align-items: center;
      padding: 14px 32px; font-size: 15px; font-weight: 600; letter-spacing: .04em;
      color: #1a1d23;
      background: rgba(255, 255, 255, .35);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .18), 0 2px 6px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .4);
      text-decoration: none; white-space: nowrap;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      animation: floatPulse 3.2s ease-in-out infinite;
    }
    .float-btn:hover {
      transform: translateX(-50%) translateY(-2px); background: rgba(255, 255, 255, .5);
      box-shadow: 0 12px 30px rgba(15, 23, 42, .24), 0 4px 10px rgba(15, 23, 42, .16), inset 0 1px 0 rgba(255, 255, 255, .5);
    }
    .float-btn:active { transform: translateX(-50%) translateY(0) scale(.98); }

    /* 扩散波纹：两层错相位波环向外扩散淡出（呼吸节奏） */
    .float-btn::before,
    .float-btn::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 999px;
      border: 2px solid var(--ripple, rgba(37, 99, 235, .38));
      pointer-events: none;
      animation: rippleWave 3.2s ease-out infinite;
    }
    .float-btn::after { animation-delay: 1.6s; }
    @keyframes rippleWave {
      0%        { transform: scale(1);   opacity: .5; }
      70%, 100% { transform: scale(1.55); opacity: 0; }
    }

    @keyframes floatPulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(15, 23, 42, .18), 0 2px 6px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .4); }
      50%      { box-shadow: 0 10px 32px rgba(15, 23, 42, .26), 0 2px 8px rgba(15, 23, 42, .16), inset 0 1px 0 rgba(255, 255, 255, .5); }
    }

    /* ---------- 动画 ---------- */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- 响应式 ---------- */
    @media (max-width: 640px) {
      .hero { padding: 18px 0 18px; }
      .gallery { gap: 14px; }
      .float-btn { font-size: 14px; padding: 12px 22px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --bg-card: #181b22; --text: #e6e8ec;
        --text-soft: #aab0bb; --text-mute: #6f7682; --line: #262a32;
        --accent: #60a5fa; --accent-soft: #1e2a44;
        --warn: #fbbf24; --warn-soft: #3a2a0c;
      }
      body { background: var(--bg); }
      .float-btn { color: #fff; background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .22); --ripple: rgba(255, 255, 255, .28); }
      .float-btn:hover { background: rgba(255, 255, 255, .2); }
      .hero .tagline { --ripple: rgba(96, 165, 250, .30); }
      @keyframes taglineBreath {
        0%, 100% { box-shadow: 0 0 0 rgba(96, 165, 250, 0); }
        50%      { box-shadow: 0 4px 16px rgba(96, 165, 250, .30); }
      }
    }
  </style>

    // ------------------------------------------------------------
    //  渲染画廊
    // ------------------------------------------------------------
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    if (!IMAGES.length) {
      gallery.innerHTML = '<p class="empty">还没有图片。</p>';
    } else {
      const frag = document.createDocumentFragment();
      IMAGES.forEach((it, i) => {
        const a = document.createElement("a");
        a.className = "card";
        a.dataset.full = it.src;
        a.setAttribute("aria-label", it.name || `图片 ${i + 1}`);

        const img = document.createElement("img");
        img.className = "thumb";
        img.loading = "lazy";
        img.decoding = "async";
        img.src = it.src;
        img.alt = it.name || `图片 ${i + 1}`;
        img.onerror = () => {
          img.alt = (it.name || "图片") + "（加载失败）";
          img.style.background = "#fde68a";
          img.removeAttribute("src");
        };

        a.appendChild(img);
        frag.appendChild(a);
      });
      gallery.appendChild(frag);
    }

    // ------------------------------------------------------------

        topBox.classList.add("fail");
        console.warn("顶部 Banner 加载失败：", topImg.src);
      });
    }

    // ------------------------------------------------------------
    //  外链点击兜底（iframe 沙箱可能拦截 _blank）
    // ------------------------------------------------------------
    function safeOpen(url) {
      let w = null;
      try { w = window.open(url, "_blank"); } catch (e) {}
      if (w && !w.closed) return;
      try { window.top.location.href = url; }
      catch (e) { window.location.href = url; }
    }
    document.querySelectorAll('a[target="_blank"][href^="http"]').forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        safeOpen(a.href);
      });
    });

    // ------------------------------------------------------------
    //  灯箱
    // ------------------------------------------------------------
    const lb    = document.getElementById("lightbox");
    const lbImg = document.getElementById("lightboxImg");
    const lbBtn = document.getElementById("lightboxClose");

    gallery.addEventListener("click", e => {
      const card = e.target.closest(".card");
      if (!card) return;
      e.preventDefault();
      lbImg.src = card.dataset.full;
      lbImg.alt = "";
      lb.classList.add("open");
    });
    const closeLb = () => { lb.classList.remove("open"); lbImg.src = ""; };
    lbBtn.addEventListener("click", closeLb);
    lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });
  </script>

  </a>
